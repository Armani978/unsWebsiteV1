services:
  medusa-postgres:
    image: postgres:16-alpine
    container_name: upnsmoke-medusa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: medusa
      POSTGRES_PASSWORD: medusa
      POSTGRES_DB: upnsmoke_medusa
    ports:
      - "5432:5432"
    volumes:
      - upnsmoke_medusa_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medusa -d upnsmoke_medusa"]
      interval: 5s
      timeout: 5s
      retries: 10

  medusa-redis:
    image: redis:7-alpine
    container_name: upnsmoke-medusa-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - upnsmoke_medusa_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  upnsmoke_medusa_pg:
  upnsmoke_medusa_redis:
